<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <!-- Background card rounded (2px border matching UI) -->
  <rect x="6" y="6" width="228" height="168" rx="20" fill="#fdf6ea" stroke="#000" stroke-width="2"/>

  <!-- Playfield Inner Area -->
  <rect x="36" y="20" width="168" height="110" rx="14" fill="#f4fbfb" stroke="#000" stroke-width="2"/>

  <!-- Pixel Art Subject: Strawberry in Center -->
  <g transform="translate(86, 32)">
    <!-- Green Leaves (Top) -->
    <rect x="24" y="0" width="8" height="8" rx="1" fill="#589a56" stroke="#467c45" stroke-width="1"/>
    <rect x="32" y="0" width="8" height="8" rx="1" fill="#589a56" stroke="#467c45" stroke-width="1"/>
    <rect x="16" y="8" width="8" height="8" rx="1" fill="#589a56" stroke="#467c45" stroke-width="1"/>
    <rect x="24" y="8" width="8" height="8" rx="1" fill="#589a56" stroke="#467c45" stroke-width="1"/>
    <rect x="32" y="8" width="8" height="8" rx="1" fill="#589a56" stroke="#467c45" stroke-width="1"/>
    <rect x="40" y="8" width="8" height="8" rx="1" fill="#589a56" stroke="#467c45" stroke-width="1"/>

    <!-- Red Strawberry Body -->
    <rect x="16" y="16" width="8" height="8" rx="1" fill="#ec8d6f" stroke="#c96a4d" stroke-width="1"/>
    <rect x="24" y="16" width="8" height="8" rx="1" fill="#ec8d6f" stroke="#c96a4d" stroke-width="1"/>
    <rect x="32" y="16" width="8" height="8" rx="1" fill="#f7e55f" stroke="#d4c243" stroke-width="1"/>
    <rect x="40" y="16" width="8" height="8" rx="1" fill="#ec8d6f" stroke="#c96a4d" stroke-width="1"/>

    <rect x="16" y="24" width="8" height="8" rx="1" fill="#ec8d6f" stroke="#c96a4d" stroke-width="1"/>
    <rect x="24" y="24" width="8" height="8" rx="1" fill="#f7e55f" stroke="#d4c243" stroke-width="1"/>
    <rect x="32" y="24" width="8" height="8" rx="1" fill="#ec8d6f" stroke="#c96a4d" stroke-width="1"/>
    <rect x="40" y="24" width="8" height="8" rx="1" fill="#ec8d6f" stroke="#c96a4d" stroke-width="1"/>

    <rect x="24" y="32" width="8" height="8" rx="1" fill="#ec8d6f" stroke="#c96a4d" stroke-width="1"/>
    <rect x="32" y="32" width="8" height="8" rx="1" fill="#ec8d6f" stroke="#c96a4d" stroke-width="1"/>
  </g>

  <!-- Busy Little Bugs (Ants) Scurrying Along Trail -->
  <!-- Bug 1: Red ant climbing up to grab bottom strawberry pixel -->
  <g transform="translate(112, 78)">
    <!-- Legs -->
    <line x1="-3" y1="-5" x2="3" y2="5" stroke="#222" stroke-width="1.2"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#222" stroke-width="1.2"/>
    <line x1="-3" y1="5" x2="3" y2="-5" stroke="#222" stroke-width="1.2"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="4.5" ry="3.5" fill="#ec8d6f" stroke="#000" stroke-width="1.5"/>
    <!-- Eyes facing up -->
    <circle cx="-1.5" cy="-2.5" r="1.2" fill="#fff"/>
    <circle cx="1.5" cy="-2.5" r="1.2" fill="#fff"/>
    <circle cx="-1.5" cy="-3" r="0.6" fill="#000"/>
    <circle cx="1.5" cy="-3" r="0.6" fill="#000"/>
  </g>

  <!-- Bug 2: Red ant carrying a pixel crumb back down to nest -->
  <g transform="translate(100, 96)">
    <!-- Legs -->
    <line x1="-3" y1="-5" x2="3" y2="5" stroke="#222" stroke-width="1.2"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#222" stroke-width="1.2"/>
    <line x1="-3" y1="5" x2="3" y2="-5" stroke="#222" stroke-width="1.2"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="4.5" ry="3.5" fill="#ec8d6f" stroke="#000" stroke-width="1.5"/>
    <!-- Eyes facing down -->
    <circle cx="-1.5" cy="2.5" r="1.2" fill="#fff"/>
    <circle cx="1.5" cy="2.5" r="1.2" fill="#fff"/>
    <circle cx="-1.5" cy="3" r="0.6" fill="#000"/>
    <circle cx="1.5" cy="3" r="0.6" fill="#000"/>
    <!-- Crumb on back -->
    <rect x="-3" y="-3" width="6" height="6" fill="#ec8d6f" stroke="#000" stroke-width="1"/>
  </g>

  <!-- Bug 3: Green ant running around the side corridor to top leaves -->
  <g transform="translate(70, 48)">
    <!-- Legs -->
    <line x1="-5" y1="-3" x2="5" y2="3" stroke="#222" stroke-width="1.2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#222" stroke-width="1.2"/>
    <line x1="-5" y1="3" x2="5" y2="-3" stroke="#222" stroke-width="1.2"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="3.5" ry="4.5" fill="#589a56" stroke="#000" stroke-width="1.5"/>
    <!-- Eyes facing up -->
    <circle cx="-1.5" cy="-3.5" r="1.2" fill="#fff"/>
    <circle cx="1.5" cy="-3.5" r="1.2" fill="#fff"/>
    <circle cx="-1.5" cy="-4" r="0.6" fill="#000"/>
    <circle cx="1.5" cy="-4" r="0.6" fill="#000"/>
  </g>

  <!-- Staging Bays / Parked Nests below -->
  <g transform="translate(42, 140)">
    <!-- Bay 1 (Empty) -->
    <rect x="0" y="0" width="24" height="22" rx="6" fill="rgba(0,0,0,0.04)" stroke="#bec6ce" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Bay 2 with Red Ant Nest (Active) -->
    <rect x="30" y="0" width="24" height="22" rx="6" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
    <circle cx="42" cy="11" r="5" fill="#ec8d6f"/>
    <rect x="46" y="-4" width="12" height="10" rx="3" fill="#000" stroke="#fff" stroke-width="1"/>
    <text x="52" y="3.5" font-family="'Comic Relief', sans-serif" font-weight="bold" font-size="6.5" fill="#fff" text-anchor="middle">12</text>

    <!-- Bay 3 (Empty) -->
    <rect x="60" y="0" width="24" height="22" rx="6" fill="rgba(0,0,0,0.04)" stroke="#bec6ce" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Bay 4 with Green Ant Nest -->
    <rect x="90" y="0" width="24" height="22" rx="6" fill="#ffffff" stroke="#000" stroke-width="1.5"/>
    <circle cx="102" cy="11" r="5" fill="#589a56"/>
    <rect x="106" y="-4" width="12" height="10" rx="3" fill="#000" stroke="#fff" stroke-width="1"/>
    <text x="112" y="3.5" font-family="'Comic Relief', sans-serif" font-weight="bold" font-size="6.5" fill="#fff" text-anchor="middle">6</text>

    <!-- Bay 5 (Empty) -->
    <rect x="120" y="0" width="24" height="22" rx="6" fill="rgba(0,0,0,0.04)" stroke="#bec6ce" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Bay 6 (Empty) -->
    <rect x="150" y="0" width="24" height="22" rx="6" fill="rgba(0,0,0,0.04)" stroke="#bec6ce" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>

  <!-- Playful stars -->
  <text x="18" y="24" font-size="12">✨</text>
  <text x="214" y="66" font-size="12">🐜</text>
</svg>
