<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <!-- Background board frame matching Giraffian design -->
  <rect x="6" y="6" width="228" height="168" rx="20" fill="#fdf6ea" stroke="#000" stroke-width="2"/>

  <!-- Color Chute Arena Container -->
  <g transform="translate(50, 20)">
    <!-- Arena Border/Base -->
    <rect x="0" y="0" width="140" height="140" rx="16" fill="#f7ede0" stroke="#000" stroke-width="2"/>

    <!-- Perimeter Chutes -->
    <!-- Top Chute (Red #ad4242) -->
    <path d="M18 0 H122 V16 H18 Z" fill="#ad4242" stroke="#000" stroke-width="1.5"/>
    <text x="70" y="12" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">▲  ▲  ▲</text>

    <!-- Bottom Chute (Blue #3a7ede) -->
    <path d="M18 124 H122 V140 H18 Z" fill="#3a7ede" stroke="#000" stroke-width="1.5"/>
    <text x="70" y="135" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">▼  ▼  ▼</text>

    <!-- Left Chute (Green #529c52) -->
    <path d="M0 18 H16 V122 H0 Z" fill="#529c52" stroke="#000" stroke-width="1.5"/>
    <text x="8" y="74" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">◀</text>

    <!-- Right Chute (Yellow #f7e752) -->
    <path d="M124 18 H140 V122 H124 Z" fill="#f7e752" stroke="#000" stroke-width="1.5"/>
    <text x="132" y="74" fill="#222222" font-size="9" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">▶</text>

    <!-- Inner Playing Field (3x3 illustrated grid) -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="100" height="100" fill="#fdf6ea" stroke="#000" stroke-width="1.5"/>

      <!-- Grid lines -->
      <line x1="33.3" y1="0" x2="33.3" y2="100" stroke="#000" stroke-width="1" stroke-dasharray="2,2" opacity="0.3"/>
      <line x1="66.6" y1="0" x2="66.6" y2="100" stroke="#000" stroke-width="1" stroke-dasharray="2,2" opacity="0.3"/>
      <line x1="0" y1="33.3" x2="100" y2="33.3" stroke="#000" stroke-width="1" stroke-dasharray="2,2" opacity="0.3"/>
      <line x1="0" y1="66.6" x2="100" y2="66.6" stroke="#000" stroke-width="1" stroke-dasharray="2,2" opacity="0.3"/>

      <!-- Tiles on board -->
      <!-- Green tile pointing left -->
      <g transform="translate(3, 36)">
        <rect width="27" height="27" rx="6" fill="#529c52" stroke="#000" stroke-width="1.5"/>
        <text x="13.5" y="18" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">←</text>
      </g>

      <!-- Yellow tile pointing right -->
      <g transform="translate(36, 36)">
        <rect width="27" height="27" rx="6" fill="#f7e752" stroke="#000" stroke-width="1.5"/>
        <text x="13.5" y="18" fill="#333" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">→</text>
      </g>

      <!-- Blue tile pointing down -->
      <g transform="translate(36, 69)">
        <rect width="27" height="27" rx="6" fill="#3a7ede" stroke="#000" stroke-width="1.5"/>
        <text x="13.5" y="19" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">↓</text>
      </g>

      <!-- Empty Space at (69, 36) -->
      <rect x="69" y="36" width="27" height="27" rx="6" fill="rgba(0,0,0,0.06)" stroke="#000" stroke-dasharray="2,2" stroke-width="1"/>

      <!-- Another blue tile -->
      <g transform="translate(3, 69)">
        <rect width="27" height="27" rx="6" fill="#3a7ede" stroke="#000" stroke-width="1.5"/>
        <text x="13.5" y="19" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">↓</text>
      </g>

      <!-- Another yellow tile -->
      <g transform="translate(69, 69)">
        <rect width="27" height="27" rx="6" fill="#f7e752" stroke="#000" stroke-width="1.5"/>
        <text x="13.5" y="18" fill="#333" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">→</text>
      </g>

      <!-- Tile (Red #ad4242) zoom-exiting through the top chute! -->
      <g transform="translate(36, -14)">
        <!-- Motion blur speed lines -->
        <line x1="6" y1="28" x2="6" y2="42" stroke="#ad4242" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        <line x1="21" y1="28" x2="21" y2="42" stroke="#ad4242" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        <!-- Zooming Tile -->
        <rect width="27" height="27" rx="6" fill="#ad4242" stroke="#000" stroke-width="2"/>
        <text x="13.5" y="19" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">↑</text>
      </g>
    </g>
  </g>
</svg>
