<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <defs>
    <radialGradient id="ball-coral" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff9d85"/>
      <stop offset="100%" stop-color="#d93829"/>
    </radialGradient>
    <radialGradient id="ball-aqua" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8ceef7"/>
      <stop offset="100%" stop-color="#1aaab8"/>
    </radialGradient>
    <radialGradient id="ball-yellow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff07a"/>
      <stop offset="100%" stop-color="#e08b1b"/>
    </radialGradient>
    <radialGradient id="ball-green" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9ef2a4"/>
      <stop offset="100%" stop-color="#3f993f"/>
    </radialGradient>
    <radialGradient id="ball-purple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ebbcfc"/>
      <stop offset="100%" stop-color="#9643c4"/>
    </radialGradient>
  </defs>

  <!-- Background card rounded (2px border matching UI) -->
  <rect x="6" y="6" width="228" height="168" rx="20" fill="#fdf6ea" stroke="#000" stroke-width="2"/>

  <!-- Left Tube -->
  <rect x="52" y="24" width="46" height="8" rx="4" fill="#d0eff2" stroke="#000" stroke-width="2"/>
  <path d="M 56 32 L 56 128 A 20 20 0 0 0 94 128 L 94 32" fill="rgba(255,255,255,0.7)" stroke="#000" stroke-width="2"/>
  <!-- Tube shine -->
  <path d="M 60 40 L 60 120" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round"/>

  <!-- Balls in left tube -->
  <circle cx="75" cy="120" r="15" fill="url(#ball-green)" stroke="#000" stroke-width="1.8"/>
  <circle cx="75" cy="88" r="15" fill="url(#ball-green)" stroke="#000" stroke-width="1.8"/>
  <circle cx="75" cy="56" r="15" fill="url(#ball-green)" stroke="#000" stroke-width="1.8"/>

  <!-- Right Tube -->
  <rect x="142" y="24" width="46" height="8" rx="4" fill="#d0eff2" stroke="#000" stroke-width="2"/>
  <path d="M 146 32 L 146 128 A 20 20 0 0 0 184 128 L 184 32" fill="rgba(255,255,255,0.7)" stroke="#000" stroke-width="2"/>
  <!-- Tube shine -->
  <path d="M 150 40 L 150 120" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round"/>

  <!-- Balls in right tube -->
  <circle cx="165" cy="120" r="15" fill="url(#ball-coral)" stroke="#000" stroke-width="1.8"/>
  <circle cx="165" cy="88" r="15" fill="url(#ball-coral)" stroke="#000" stroke-width="1.8"/>

  <!-- Arc path showing ball in flight -->
  <path d="M 75 40 Q 120 -8 165 40" fill="none" stroke="#3a7ede" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Floating ball on arc -->
  <circle cx="120" cy="18" r="16" fill="url(#ball-coral)" stroke="#000" stroke-width="2"/>

  <!-- Sparkles -->
  <text x="110" y="80" font-size="18">✨</text>
  <text x="32" y="55" font-size="15">✨</text>
  <text x="195" y="65" font-size="16">⭐</text>
</svg>
