<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -16 190 144" width="190" height="144">
  <!-- 1x2 Horizontal Car (Yellow) pointing Right -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="76" height="36" rx="10" fill="#f7e55f" stroke="#000" stroke-width="2"/>
    <path d="M48 18 L28 18 M48 18 L40 12 M48 18 L40 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="18" r="3.5" fill="#000" opacity="0.3"/>
  </g>

  <!-- 1x1 Block (Aqua) pointing Down -->
  <g transform="translate(84, 0)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#82dee6" stroke="#000" stroke-width="2"/>
    <path d="M18 28 L18 8 M18 28 L12 20 M18 28 L24 20" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Swooshing 1x1 Block (Green) flying out Top-Right with speed trails -->
  <g transform="translate(136, -8) rotate(12)">
    <line x1="-16" y1="26" x2="-4" y2="26" stroke="#589a56" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="-20" y1="12" x2="-6" y2="12" stroke="#589a56" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#589a56" stroke="#000" stroke-width="2"/>
    <path d="M26 10 L10 26 M26 10 L14 10 M26 10 L26 22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 1x2 Vertical Car (Coral) pointing Up -->
  <g transform="translate(0, 44)">
    <rect x="0" y="0" width="36" height="76" rx="10" fill="#ec8d6f" stroke="#000" stroke-width="2"/>
    <path d="M18 28 L18 48 M18 28 L12 36 M18 28 L24 36" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18" cy="58" r="3.5" fill="#000" opacity="0.3"/>
  </g>

  <!-- 1x2 Horizontal Car (Purple) pointing Left -->
  <g transform="translate(44, 44)">
    <rect x="0" y="0" width="76" height="36" rx="10" fill="#dcb0ed" stroke="#000" stroke-width="2"/>
    <path d="M14 18 L34 18 M14 18 L22 12 M14 18 L22 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="56" cy="18" r="3.5" fill="#000" opacity="0.3"/>
  </g>

  <!-- 1x1 Block (Blue) pointing Down -->
  <g transform="translate(88, 84)">
    <rect x="0" y="0" width="36" height="36" rx="10" fill="#3a7ede" stroke="#000" stroke-width="2"/>
    <path d="M18 28 L18 8 M18 28 L12 20 M18 28 L24 20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
