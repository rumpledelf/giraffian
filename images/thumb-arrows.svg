<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <!-- Card Background -->
  <rect x="6" y="6" width="228" height="168" rx="20" fill="#fdf6ea" stroke="#000" stroke-width="2"/>

  <!-- Dotted Grid Backdrop -->
  <g transform="translate(36, 24)" fill="none" stroke="#bec6ce" stroke-width="1.5" stroke-dasharray="3 3">
    <rect x="0" y="0" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>
    <rect x="34" y="0" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>
    <rect x="68" y="0" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>
    <rect x="102" y="0" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>
    <rect x="136" y="0" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>

    <rect x="0" y="34" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>
    <rect x="34" y="34" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>
    <rect x="68" y="34" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>
    <rect x="102" y="34" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>
    <rect x="136" y="34" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>

    <rect x="0" y="68" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>
    <rect x="34" y="68" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>
    <rect x="68" y="68" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>
    <rect x="102" y="68" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>
    <rect x="136" y="68" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>

    <rect x="0" y="102" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>
    <rect x="34" y="102" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>
    <rect x="68" y="102" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>
    <rect x="102" y="102" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>
    <rect x="136" y="102" width="30" height="30" rx="6" fill="rgba(0,0,0,0.02)"/>
  </g>

  <!-- Winding Chunky Arrow Pieces: butt-capped bodies end flush at each head, tail circles round the back -->
  <g transform="translate(36, 24)">
    <!-- 1. Coral Path (Bottom-Left snaking Right) -->
    <path d="M 15,117 L 15,83 L 49,83 L 49,49 L 118,49" fill="none" stroke="#000" stroke-width="20" stroke-linejoin="round"/>
    <circle cx="15" cy="117" r="10" fill="#000"/>
    <polygon points="131,49 118,36 118,62" fill="#ec8d6f" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 15,117 L 15,83 L 49,83 L 49,49 L 119.5,49" fill="none" stroke="#ec8d6f" stroke-width="16" stroke-linejoin="round"/>
    <circle cx="15" cy="117" r="8" fill="#ec8d6f"/>
    <!-- 2. Yellow Path (Bottom snaking Down) -->
    <path d="M 49,117 L 83,117 L 83,83 L 117,83 L 117,118" fill="none" stroke="#000" stroke-width="20" stroke-linejoin="round"/>
    <circle cx="49" cy="117" r="10" fill="#000"/>
    <polygon points="117,131 104,118 130,118" fill="#f7e55f" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 49,117 L 83,117 L 83,83 L 117,83 L 117,119.5" fill="none" stroke="#f7e55f" stroke-width="16" stroke-linejoin="round"/>
    <circle cx="49" cy="117" r="8" fill="#f7e55f"/>
    <!-- 3. Aqua Path (Top winding Right) -->
    <path d="M 15,49 L 15,15 L 84,15" fill="none" stroke="#000" stroke-width="20" stroke-linejoin="round"/>
    <circle cx="15" cy="49" r="10" fill="#000"/>
    <polygon points="97,15 84,2 84,28" fill="#82dee6" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 15,49 L 15,15 L 85.5,15" fill="none" stroke="#82dee6" stroke-width="16" stroke-linejoin="round"/>
    <circle cx="15" cy="49" r="8" fill="#82dee6"/>
    <!-- 4. Purple Path (Top-Right winding Down) -->
    <path d="M 117,15 L 151,15 L 151,84" fill="none" stroke="#000" stroke-width="20" stroke-linejoin="round"/>
    <circle cx="117" cy="15" r="10" fill="#000"/>
    <polygon points="151,97 138,84 164,84" fill="#dcb0ed" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 117,15 L 151,15 L 151,85.5" fill="none" stroke="#dcb0ed" stroke-width="16" stroke-linejoin="round"/>
    <circle cx="117" cy="15" r="8" fill="#dcb0ed"/>
  </g>
</svg>
